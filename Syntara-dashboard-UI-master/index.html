<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="layout">

        <aside class="sidebar">
            <div class="logo">
                <img src="/assets/1000_F_375678522_oRQ386vS66JRWvdGK5qWKoZZMSIpineN.jpg " alt="logo">
            </div>

            <nav class="nav">
                <a href="#">Dashboard</a>
                <a href="#">Tasks</a>
                <a href="#">Notes</a>
            </nav>
        </aside>


        <main class="content">
            <main class="content">
                <section class="page-header">
                    <h1>Dashboard</h1>
                    <p>Your daily overview at a glance</p>
                </section>

                <section class="stats">
                    <div class="card">
                        <span class="label">Tasks Today</span>
                        <span class="value">5</span>
                    </div>

                    <div class="card">
                        <span class="label">Notes</span>
                        <span class="value">12</span>
                    </div>

                    <div class="card">
                        <span class="label">Study Hours</span>
                        <span class="value">3.5</span>
                    </div>
                </section>

                <section class="dashboard-main">

                    <!-- Primary block -->
                    <div class="panel">
                        <h2>Pending Tasks</h2>
                        <ul class="task-list">
                            <li>Revise EDC Unit 2</li>
                            <li>CSS Grid practice</li>
                            <li>Finish dashboard layout</li>
                        </ul>
                    </div>

                    <div class="panel">
                        <h2>Quick Notes</h2>
                        <p class="empty">No notes added yet.</p>
                    </div>

                </section>

            </main>

        </main>

    </div>

    <footer class="footer">
        Syntara © 2025
    </footer>

</body>

</html>
